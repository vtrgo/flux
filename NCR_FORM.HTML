<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabricated Components - Non-Conformance Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
        }
        h2 {
            text-align: center;
            color: #006680; /* Teal matching VTR branding */
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.6rem;
        }
        h3 {
            text-align: center;
            color: #4a5568;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .section-title {
            background-color: #e6f4f8;
            color: #00556c;
            padding: 8px 12px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
            border-left: 4px solid #006680;
            border-radius: 0 4px 4px 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="date"], textarea {
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #006680;
            box-shadow: 0 0 0 3px rgba(0, 102, 128, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 12px; /* Adds space between the buttons */
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-print {
            background-color: #006680;
            color: white;
        }
        .btn-print:hover {
            background-color: #004d61;
        }
        .btn-reset {
            background-color: #e2e8f0;
            color: #4a5568;
            border: 1px solid #cbd5e0;
        }
        .btn-reset:hover {
            background-color: #cbd5e0;
            color: #2d3748;
        }
        
        /* Print optimization to ensure buttons disappear on the PDF */
        @media print {
            body { background: white; padding: 0; }
            .form-container { box-shadow: none; border: none; padding: 0; }
            .actions { display: none; }
            input, textarea { border: 1px solid #999 !important; background: transparent; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px;">
        <div>
            <img src="VTR Logo - Small.jpg" alt="VTR Feeder Solutions Logo" style="max-width: 240px; height: auto; display: block;">
        </div>
        <div style="text-align: right;">
            <h2 style="color: #006680; margin: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 1.6rem;">Fabricated Components</h2>
            <h3 style="color: #4a5568; margin: 5px 0 0 0; font-weight: 600; border: none; padding: 0;">Non-Conformance Report</h3>
        </div>
    </div>
    
    <form id="ncrForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="ncrId">NCR Identification #</label>
                <input type="text" id="ncrId" name="ncrId" placeholder="e.g., NCR-2026-001" required>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="projectNum">Project #</label>
                <input type="text" id="projectNum" name="projectNum" placeholder="Enter project number" required>
            </div>
            <div class="form-group">
                <label for="assembler">Assembler</label>
                <input type="text" id="assembler" name="assembler" placeholder="Technician name" required>
            </div>
        </div>

        <div class="section-title">Non-Conformance Details</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="location">Location of NC (Component / Station / Joint)</label>
                <input type="text" id="location" name="location" placeholder="e.g., Station 3, main assembly track" required>
            </div>
            <div class="form-group full-width">
                <label for="description">Description of Defect</label>
                <textarea id="description" name="description" placeholder="Provide a detailed description of the non-conformance..." required></textarea>
            </div>
        </div>

        <div class="section-title">Non-Conformance Close-out</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="cause">Root Cause of NCR</label>
                <textarea id="cause" name="cause" placeholder="Why did this occur?"></textarea>
            </div>
            <div class="form-group full-width">
                <label for="correction">Correction Taken / Action Items</label>
                <textarea id="correction" name="correction" placeholder="Describe the rework or corrective action executed..."></textarea>
            </div>
            <div class="form-group">
                <label for="completionDate">Date for Completion / Verification</label>
                <input type="date" id="completionDate" name="completionDate">
            </div>
            <div class="form-group">
                <label for="signature">Team Lead Signature / Sign-off</label>
                <input type="text" id="signature" name="signature" placeholder="Sign digitally or print to sign">
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn-reset" onclick="resetForm()">Reset Form</button>
            <button type="button" class="btn-print" onclick="window.print()">Print / Save to PDF</button>
        </div>
    </form>
</div>

<script>
    // Function to set default date to today
    function setDefaultDate() {
        document.getElementById('date').valueAsDate = new Date();
    }

    // Run on initial page load
    window.onload = setDefaultDate;

    // Reset function that clears inputs and retains today's date
    function resetForm() {
        if (confirm("Are you sure you want to clear all fields? Unsaved changes will be lost.")) {
            document.getElementById('ncrForm').reset();
            setDefaultDate(); // Ensure date stays current after full reset
        }
    }
</script>

</body>
</html>
